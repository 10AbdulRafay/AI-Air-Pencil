name: Deploy to velixir

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and deploy with Velixir CLI
        env:
          VELIXIR_TOKEN: ${{ secrets.VELIXIR_API_KEY }}
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          export PATH="$HOME/.velixir/bin:$PATH"
          velixir deploy --app beae298c-ecfc-45e7-9e79-52a549bbdde1
